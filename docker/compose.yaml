services:
  progresslabeller:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    image: progresslabeller:dev
    container_name: progresslabeller_dev
    network_mode: host
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,display,compute,utility
      - PYOPENGL_PLATFORM=egl
      - PROGRESSLABELLER_PATH=/workspace/ProgressLabeller
      - PROGRESSLABELLER_BLENDER_PATH=/opt/blender-2.92
      - ORB3_SOURCE_DIR=/opt/ORB_SLAM3
      - COLMAP_PY=/opt/colmap-venv/bin/python
      - VGGT_PY=/opt/vggt-venv/bin/python
      - VGGT_SLAM_DIR=/opt/VGGT-SLAM
      - VGGT_WEIGHTS=/workspace/ProgressLabeller/weights
      - TORCH_HOME=/workspace/ProgressLabeller/weights
    volumes:
      - ../:/workspace/ProgressLabeller
      - /tmp/.X11-unix:/tmp/.X11-unix
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "110"
    working_dir: /workspace/ProgressLabeller
    stdin_open: true
    tty: true
    command: bash
